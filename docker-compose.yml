services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustgraph-api
    environment:
      TRUSTGRAPH_PORT: "8080"
      TRUSTGRAPH_ENVIRONMENT: "development"
      TRUSTGRAPH_DATABASE_URL: "postgres://connectsphere:connectsphere_dev_password@connectsphere-postgres:5432/trustgraph?sslmode=disable"
      TRUSTGRAPH_LOG_LEVEL: "debug"
    ports:
      - "8081:8080"
    networks:
      - connectionsphere_default
    depends_on:
      trustgraph-db-init:
        condition: service_completed_successfully

  trustgraph-db-init:
    image: postgres:17-alpine
    container_name: trustgraph-db-init
    environment:
      PGHOST: connectsphere-postgres
      PGUSER: connectsphere
      PGPASSWORD: connectsphere_dev_password
    entrypoint: >
      sh -c '
        until pg_isready -h connectsphere-postgres -U connectsphere; do sleep 1; done
        psql -h connectsphere-postgres -U connectsphere -tc "SELECT 1 FROM pg_database WHERE datname = '"'"'trustgraph'"'"'" | grep -q 1 ||
          psql -h connectsphere-postgres -U connectsphere -c "CREATE DATABASE trustgraph"
        echo "trustgraph database ready"
      '
    networks:
      - connectionsphere_default

networks:
  connectionsphere_default:
    external: true
