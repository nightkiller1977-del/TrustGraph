services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustgraph-api
    environment:
      TRUSTGRAPH_PORT: "${TRUSTGRAPH_PORT:-8080}"
      TRUSTGRAPH_ENVIRONMENT: "${TRUSTGRAPH_ENVIRONMENT:-development}"
      TRUSTGRAPH_DATABASE_URL: "${TRUSTGRAPH_DATABASE_URL}"
      TRUSTGRAPH_LOG_LEVEL: "${TRUSTGRAPH_LOG_LEVEL:-info}"
    ports:
      - "8081:8080"
    networks:
      - connectionsphere_default
    depends_on:
      trustgraph-db-init:
        condition: service_completed_successfully

  trustgraph-db-init:
    image: postgres:17-alpine
    container_name: trustgraph-db-init
    environment:
      PGHOST: "${PGHOST:-connectsphere-postgres}"
      PGUSER: "${PGUSER}"
      PGPASSWORD: "${PGPASSWORD}"
    entrypoint: >
      sh -c '
        until pg_isready -h connectsphere-postgres -U connectsphere; do sleep 1; done
        psql -h connectsphere-postgres -U connectsphere -tc "SELECT 1 FROM pg_database WHERE datname = '"'"'trustgraph'"'"'" | grep -q 1 ||
          psql -h connectsphere-postgres -U connectsphere -c "CREATE DATABASE trustgraph"
        echo "trustgraph database ready"
      '
    networks:
      - connectionsphere_default

networks:
  connectionsphere_default:
    external: true
